name: EPC regression tests
on:
  pull_request:
    paths: ['netlify/functions/**', 'tests/**', 'index.html', '.github/workflows/epc-regression.yml']
  push:
    branches: [main]
    paths: ['netlify/functions/**', 'tests/**', 'index.html', '.github/workflows/epc-regression.yml']
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/epc-lookup.test.mjs
